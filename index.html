<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fbfb" />
  <title>SNOW MAP</title>
  <!-- SNOW MAP v0.4.2: 導入は雪結晶／地図は黄色い光のタップ誘導 -->
  <style>
    :root {
      --ink: #31475f;
      --paper: #ffffff;
      --panel: rgba(255,255,255,.96);
      --line: rgba(49,71,95,.14);
      --shadow: 0 18px 48px rgba(47,70,88,.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      overflow-x: hidden;
    }
    button, a { font: inherit; }

    .app {
      width: min(100%, 560px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
    }

    .topbar {
      position: relative;
      z-index: 10;
      padding: 3px 22px 4px;
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 7.4vw, 36px);
      font-weight: 500;
      letter-spacing: .13em;
    }
    .top-copy {
      margin: 4px 0 0;
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: .05em;
      font-weight: 520;
    }
    .hint {
      margin: 1px 0 0;
      font-size: 10px;
      letter-spacing: .07em;
      opacity: .5;
      transition: opacity .35s ease;
    }

    .map-viewport {
      position: relative;
      width: 100%;
      margin-top: -2px;
      overflow: hidden;
      isolation: isolate;
      background: #ffffff;
    }

    .map-stage {
      position: relative;
      width: 112%;
      margin-left: -6%;
    }

    .map-images {
      position: relative;
      width: 100%;
    }
    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 1;
      transition: opacity .65s ease;
    }
    .map-image.switching { opacity: 0; }

    .ambient,
    .lights {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .ambient { z-index: 2; transition: background .8s ease; }
    .lights { z-index: 4; }

    /* 地図上のタップ誘導：景色を邪魔しない、小さな暖色の光 */
    .beacon {
      position: absolute;
      z-index: 5;
      width: 15%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .beacon::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255,255,244,.98);
      box-shadow:
        0 0 0 2px rgba(255,255,255,.62),
        0 0 7px 3px rgba(255,224,112,.78),
        0 0 16px 7px rgba(255,205,76,.34);
      animation: beaconGlow 2.7s ease-in-out infinite;
      pointer-events: none;
    }
    .beacon:nth-of-type(3n)::before { animation-delay: -.8s; }
    .beacon:nth-of-type(3n+1)::before { animation-delay: -1.55s; }
    .beacon:focus-visible { outline: 2px dashed rgba(55,118,134,.72); outline-offset: -22px; }
    .beacon:active::before { transform: translate(-50%,-50%) scale(1.22); }

    .time-evening .beacon::before,
    .time-night .beacon::before {
      background: rgba(255,252,224,1);
      box-shadow:
        0 0 0 2px rgba(255,255,255,.72),
        0 0 8px 4px rgba(255,221,102,.9),
        0 0 18px 8px rgba(255,187,62,.42);
    }

    @keyframes beaconGlow {
      0%,100% {
        opacity: .58;
        transform: translate(-50%,-50%) scale(.78);
      }
      50% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.08);
      }
    }

    .dome-aura {
      position: absolute;
      z-index: 3;
      left: 67.5%;
      top: 29.2%;
      width: 27%;
      aspect-ratio: 1;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,250,205,.42), rgba(158,223,244,.14) 47%, transparent 72%);
      filter: blur(6px);
      animation: domeBreath 4.2s ease-in-out infinite;
    }
    @keyframes domeBreath {
      0%,100% { opacity: .45; transform: translate(-50%,-50%) scale(.94); }
      50% { opacity: .82; transform: translate(-50%,-50%) scale(1.05); }
    }

    /* 時間帯は描き分けた4枚の画像で表現します */
    .time-morning .ambient,
    .time-day .ambient,
    .time-evening .ambient,
    .time-night .ambient { background: transparent; }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(28,40,51,.17);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      z-index: 21;
      left: 50%;
      bottom: 0;
      width: min(100%, 560px);
      transform: translate(-50%, 105%);
      border-radius: 27px 27px 0 0;
      background: var(--panel);
      box-shadow: 0 -18px 60px rgba(36,55,70,.23);
      padding: 12px 20px max(19px, env(safe-area-inset-bottom));
      transition: transform .32s cubic-bezier(.2,.8,.2,1);
    }
    .sheet.open { transform: translate(-50%,0); }
    .handle { width: 36px; height: 4px; margin: 0 auto 15px; border-radius: 99px; background: rgba(49,71,95,.17); }
    .place-label { margin: 0; font-size: 10px; letter-spacing: .16em; opacity: .46; }
    .place-name { margin: 3px 0 0; font-size: 15px; letter-spacing: .09em; font-weight: 650; }
    .experience { margin: 5px 0 0; font-size: 13px; letter-spacing: .12em; color: #668092; font-weight: 650; }
    .divider { height: 1px; margin: 13px 0 12px; background: linear-gradient(90deg,var(--line),transparent); }
    .song-label { margin: 0 0 3px; font-size: 10px; letter-spacing: .16em; opacity: .44; }
    .song-name { margin: 0 0 13px; font-size: clamp(23px,6.7vw,32px); line-height: 1.25; font-weight: 660; letter-spacing: .015em; }
    .services { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 11px; }
    .service {
      display: flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 7px;
      border: 1px solid var(--line); border-radius: 14px;
      color: var(--ink); text-decoration: none;
      background: rgba(255,255,255,.72);
      font-size: 12px; font-weight: 650;
    }
    .next { width: 100%; min-height: 51px; border: 0; border-radius: 17px; color: white; background: var(--ink); font-weight: 700; letter-spacing: .08em; cursor: pointer; }
    .close { display: block; margin: 10px auto 0; border: 0; background: transparent; color: var(--ink); opacity: .57; padding: 8px 16px; cursor: pointer; }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: #ffffff;
      transition: opacity .55s ease, visibility .55s ease;
    }
    .intro.hide { opacity: 0; visibility: hidden; }
    .intro-mark { text-align: center; }
    .intro-mark strong { display: block; font-family: Georgia,"Times New Roman",serif; font-size: 30px; font-weight: 500; letter-spacing: .14em; }
    .intro-snow {
      width: 38px;
      height: 38px;
      margin: 16px auto 0;
      color: #6ca7c2;
      filter:
        drop-shadow(0 0 2px rgba(255,255,255,1))
        drop-shadow(0 0 9px rgba(112,186,216,.7));
      animation: introFlakeGlow 2s ease-in-out infinite;
    }
    .intro-snow line {
      vector-effect: non-scaling-stroke;
      stroke: currentColor;
      stroke-width: 1.25;
      stroke-linecap: round;
    }
    @keyframes introFlakeGlow {
      0%,100% { opacity: .38; transform: translateY(3px) rotate(-3deg) scale(.9); }
      50% { opacity: 1; transform: translateY(-2px) rotate(3deg) scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .intro { display: none; }
    }
  </style>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-mark"><strong>SNOW MAP</strong><svg class="intro-snow snowflake-svg" aria-hidden="true" viewBox="0 0 24 24"></svg></div>
  </div>

  <main class="app" id="app">
    <header class="topbar">
      <h1>SNOW MAP</h1>
      <p class="top-copy">今日は、どの景色を歩きますか。</p>
      <p class="hint" id="hint">雪の結晶が光る景色に触れてみてください</p>
    </header>

    <section class="map-viewport" aria-label="SNOW MAPの地図">
      <div class="map-stage">
        <div class="map-images" aria-label="海と街、Snow Dome、木漏れ日の道、はじまりの広場、ブルーハーバー、シーズンガーデンがつながるSNOW MAP">
          <img class="map-image active" id="mapImage" src="snow-map-day.png" alt="SNOW MAPの地図" />
        </div>
        <div class="ambient"></div>
        <div class="lights"></div>
        <div class="dome-aura" aria-hidden="true"></div>

        <button class="beacon" style="left:45.3%;top:5.2%;" data-place="展望台" aria-label="展望台"></button>
        <button class="beacon" style="left:39.2%;top:20.3%;" data-place="シティライト" aria-label="シティライト"></button>
        <button class="beacon" style="left:68.0%;top:29.3%;" data-place="Snow Dome" aria-label="Snow Dome"></button>
        <button class="beacon" style="left:21.2%;top:40.1%;" data-place="木漏れ日の道" aria-label="木漏れ日の道"></button>
        <button class="beacon" style="left:50.0%;top:36.9%;" data-place="歩道橋" aria-label="歩道橋"></button>
        <button class="beacon" style="left:67.3%;top:49.2%;" data-place="はじまりの広場" aria-label="はじまりの広場"></button>
        <button class="beacon" style="left:72.1%;top:59.2%;" data-place="カフェ" aria-label="カフェ"></button>
        <button class="beacon" style="left:25.8%;top:65.7%;" data-place="ブルーハーバー" aria-label="ブルーハーバー"></button>
        <button class="beacon" style="left:64.4%;top:78.8%;" data-place="シーサイド" aria-label="シーサイド"></button>
        <button class="beacon" style="left:38.8%;top:74.4%;" data-place="シーズンガーデン" aria-label="シーズンガーデン"></button>
      </div>
    </section>
  </main>

  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="songName">
    <div class="handle"></div>
    <p class="place-label">PLACE</p>
    <p class="place-name" id="placeName"></p>
    <p class="experience" id="experience"></p>
    <div class="divider"></div>
    <p class="song-label">MUSIC</p>
    <h2 class="song-name" id="songName"></h2>
    <div class="services">
      <a class="service" id="spotifyLink" target="_blank" rel="noopener">Spotify</a>
      <a class="service" id="appleLink" target="_blank" rel="noopener">Apple Music</a>
      <a class="service" id="youtubeLink" target="_blank" rel="noopener">YouTube</a>
    </div>
    <button class="next" id="nextButton">この先へ</button>
    <button class="close" id="closeButton">地図へ戻る</button>
  </section>

  <script>
    "use strict";

    const snowflakeLines = [
      [12,2,12,22], [2,12,22,12], [5,5,19,19], [19,5,5,19],
      [12,2,9.8,4.8], [12,2,14.2,4.8], [12,22,9.8,19.2], [12,22,14.2,19.2],
      [2,12,4.8,9.8], [2,12,4.8,14.2], [22,12,19.2,9.8], [22,12,19.2,14.2],
      [5,5,5.5,8.4], [5,5,8.4,5.5], [19,19,15.6,18.5], [19,19,18.5,15.6],
      [19,5,15.6,5.5], [19,5,18.5,8.4], [5,19,5.5,15.6], [5,19,8.4,18.5]
    ];
    function drawSnowflake(svg){
      const ns="http://www.w3.org/2000/svg";
      snowflakeLines.forEach(([x1,y1,x2,y2])=>{
        const line=document.createElementNS(ns,"line");
        line.setAttribute("x1",x1); line.setAttribute("y1",y1);
        line.setAttribute("x2",x2); line.setAttribute("y2",y2);
        svg.appendChild(line);
      });
    }
    document.querySelectorAll(".snowflake-svg").forEach(drawSnowflake);

    const places = {
      "展望台": { verb:"見渡す", songs:["We'll go together","EVERYTHING IS EVERYTHING","星のうた","7%","SBY"], next:["歩道橋","シティライト","ブルーハーバー"] },
      "シティライト": { verb:"駆け抜ける", songs:["Spark!!","BANG‼︎","I・だって止まらない","SAVE YOUR HEART","W"], next:["歩道橋","Snow Dome","展望台","ブルーハーバー"] },
      "Snow Dome": { verb:"帰ってくる", songs:["P.M.G.","Party! Party! Party!","Crazy F-R-E-S-H Beat","Make It Hot","守りたい、その笑顔"], next:["はじまりの広場","シティライト","歩道橋"] },
      "木漏れ日の道": { verb:"歩く", songs:["From Today","A PIECE OF CAKE","Brand New Smile","TIKI TIKI","Days"], next:["歩道橋","はじまりの広場","ブルーハーバー","シーズンガーデン"] },
      "歩道橋": { verb:"選ぶ", songs:["オトノナルホウヘ","Don't Hold Back","グッタイム","iro iro","ファンターナモーレ"], next:["展望台","シティライト","Snow Dome","木漏れ日の道","はじまりの広場"] },
      "はじまりの広場": { verb:"出会う", songs:["Snow World","Happy Birthday","NO SURRENDER！","ナミダの海を越えて行け","ブラザービート"], next:["Snow Dome","木漏れ日の道","カフェ","歩道橋"] },
      "カフェ": { verb:"休む", songs:["ANY & EVERY","Luv Classic","Big Bang Sweet","What's your color?","Color me live..."], next:["はじまりの広場","木漏れ日の道","シーズンガーデン","シーサイド"] },
      "ブルーハーバー": { verb:"旅立つ", songs:["Lock on!","Wonderful! × Surprise!","Ready Go Round","ミッドナイト・トレンディ","8月の青"], next:["シーサイド","木漏れ日の道","展望台","シティライト"] },
      "シーサイド": { verb:"風を感じる", songs:["Stories","REFRESH","YumYumYum 〜SpicyGirl〜","DA BOMB","Hip bounce!!"], next:["ブルーハーバー","シーズンガーデン","カフェ","シティライト"] },
      "シーズンガーデン": { verb:"季節を感じる", songs:["HELLO HELLO","オレンジkiss","君は僕のもの","いっそ、嫌いになれたら。","My Sweet Girl"], next:["シーサイド","カフェ","木漏れ日の道","はじまりの広場"] }
    };

    const app=document.getElementById("app"), intro=document.getElementById("intro"), hint=document.getElementById("hint");
    const mapImage=document.getElementById("mapImage");
    const timeImages={
      morning:"snow-map-morning.png",
      day:"snow-map-day.png",
      evening:"snow-map-evening.png",
      night:"snow-map-night.png"
    };
    let currentTimeKey=null;
    const sheet=document.getElementById("sheet"), backdrop=document.getElementById("backdrop");
    const placeName=document.getElementById("placeName"), experience=document.getElementById("experience"), songName=document.getElementById("songName");
    const nextButton=document.getElementById("nextButton"), closeButton=document.getElementById("closeButton");
    const spotifyLink=document.getElementById("spotifyLink"), appleLink=document.getElementById("appleLink"), youtubeLink=document.getElementById("youtubeLink");
    let currentPlace=null, previousSong=null;

    function getTimeKey(){
      const h=new Date().getHours();
      if(h>=5&&h<11) return "morning";
      if(h>=11&&h<16) return "day";
      if(h>=16&&h<19) return "evening";
      return "night";
    }
    function setWorldTime(){
      const key=getTimeKey();
      app.classList.remove("time-morning","time-day","time-evening","time-night");
      app.classList.add(`time-${key}`);
      if(key===currentTimeKey) return;
      currentTimeKey=key;
      const nextSrc=timeImages[key];
      const preload=new Image();
      preload.onload=()=>{
        mapImage.classList.add("switching");
        setTimeout(()=>{
          mapImage.src=nextSrc;
          requestAnimationFrame(()=>mapImage.classList.remove("switching"));
        },260);
      };
      preload.src=nextSrc;
    }
    function pick(list,excluded=null){ const c=list.filter(x=>x!==excluded); const p=c.length?c:list; return p[Math.floor(Math.random()*p.length)]; }
    function updateLinks(title){ const q=encodeURIComponent(`Snow Man ${title}`); spotifyLink.href=`https://open.spotify.com/search/${q}`; appleLink.href=`https://music.apple.com/jp/search?term=${q}`; youtubeLink.href=`https://www.youtube.com/results?search_query=${q}`; }
    function showSong(place){
      currentPlace=place;
      const data=places[place], song=pick(data.songs,previousSong);
      previousSong=song; placeName.textContent=place; experience.textContent=data.verb; songName.textContent=song; updateLinks(song);
      sheet.classList.add("open"); backdrop.classList.add("open"); document.body.style.overflow="hidden"; hint.style.opacity="0";
    }
    function continueWalk(){ if(currentPlace) showSong(pick(places[currentPlace].next)); }
    function closeSheet(){ sheet.classList.remove("open"); backdrop.classList.remove("open"); document.body.style.overflow=""; }

    document.querySelectorAll(".beacon").forEach(b=>{
      b.addEventListener("click",()=>showSong(b.dataset.place));
    });
    nextButton.addEventListener("click",continueWalk); closeButton.addEventListener("click",closeSheet); backdrop.addEventListener("click",closeSheet);
    document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
    setWorldTime(); setInterval(setWorldTime,60000);
    window.addEventListener("load",()=>setTimeout(()=>intro.classList.add("hide"),900));
  </script>
</body>
</html>
