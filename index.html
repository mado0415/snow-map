<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="themeColor" content="#f8fbfb" />
  <title>SNOW MAP</title>
  <!-- SNOW MAP v0.7.6: カメラ質感・導入結晶・環境音・夜間灯り -->
  <style>
    :root {
      --ink: #31475f;
      --paper: #ffffff;
      --panel: rgba(255,255,255,.88);
      --line: rgba(49,71,95,.14);
      --shadow: 0 18px 48px rgba(47,70,88,.16);
    }

    * { box-sizing: border-box; }
    :root {
      --world-top: #f8fbfb;
      --world-mid: #f8fbfb;
      --world-bottom: #f8fbfb;
      --top-ink: #31475f;
      --top-muted: rgba(49,71,95,.50);
      --night-light-alpha: .18;
      --night-light-spread: 1;
    }
    html {
      margin: 0;
      min-height: 100%;
      background: var(--world-bottom);
      transition: background-color .9s linear;
    }
    body {
      margin: 0;
      min-height: 100svh;
      position: relative;
      background: transparent;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -100;
      pointer-events: none;
      background: linear-gradient(180deg, var(--world-top) 0%, var(--world-mid) 48%, var(--world-bottom) 100%);
      transition: background .9s linear;
    }
    button, a { font: inherit; }

    .app {
      width: min(100%, 560px);
      background: transparent;
      min-height: 100svh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
    }

    .topbar {
      position: relative;
      z-index: 10;
      padding: 3px 22px 4px;
      pointer-events: none;
    }
    .sound-toggle {
      position: absolute;
      right: 18px;
      top: 5px;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 50%;
      background: rgba(255,255,255,.34);
      color: var(--top-ink);
      display: grid;
      place-items: center;
      padding: 0;
      opacity: .82;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(25,44,62,.10);
      pointer-events: auto;
      cursor: pointer;
      transition: color .4s ease, background .4s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .sound-toggle:active { transform: scale(.96); }
    .sound-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .sound-toggle .sound-off-line { opacity: 1; transition: opacity .2s ease; }
    .sound-toggle.on .sound-off-line { opacity: 0; }
    h1 {
      margin: 0;
      color: var(--top-ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 7.4vw, 36px);
      font-weight: 500;
      letter-spacing: .13em;
    }
    .top-copy {
      margin: 4px 0 0;
      color: var(--top-ink);
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: .05em;
      font-weight: 520;
    }
    .hint {
      margin: 1px 0 0;
      color: var(--top-muted);
      font-size: 10px;
      letter-spacing: .07em;
      opacity: .5;
      transition: opacity .35s ease;
    }

    .map-viewport {
      position: relative;
      width: 100%;
      margin-top: -2px;
      overflow: hidden;
      isolation: isolate;
      background: transparent;
    }

    .map-stage {
      position: relative;
      width: 100%;
      margin-left: 0;
      transform: translate3d(var(--pan-x, 0px), 0, 0) scale(1);
      transform-origin: var(--walk-x, 50%) var(--walk-y, 50%);
      transition:
        transform 2.55s cubic-bezier(.16,.72,.14,1),
        transform-origin 2.55s cubic-bezier(.16,.72,.14,1);
      will-change: transform;
    }
    .map-stage.walking {
      transform: translate3d(var(--pan-x, 0px), 0, 0) scale(1.38);
    }
    .map-stage.strolling {
      transition-duration: 2.45s;
      transition-timing-function: cubic-bezier(.16,.72,.14,1);
      transform: translate3d(var(--pan-x, 0px), 0, 0) scale(var(--stroll-scale, 1.46));
    }

    .map-images {
      position: relative;
      width: 100%;
    }
    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 1;
      transition: opacity .65s ease;
    }
    .map-image.switching { opacity: 0; }

    .ambient,
    .lights {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .ambient { z-index: 2; transition: background .8s ease; }
    .lights {
      z-index: 4;
      opacity: var(--night-light-alpha);
      transition: opacity 1.2s linear, filter 1.2s linear;
      filter: blur(calc(2px * var(--night-light-spread)));
      background:
        radial-gradient(circle at 39% 19%, rgba(255,226,126,.82) 0 1.1%, transparent 4.8%),
        radial-gradient(circle at 68% 29%, rgba(255,239,166,.86) 0 1.4%, transparent 5.5%),
        radial-gradient(circle at 67% 49%, rgba(255,215,110,.74) 0 .9%, transparent 4.2%),
        radial-gradient(circle at 72% 59%, rgba(255,210,105,.72) 0 .8%, transparent 3.8%),
        radial-gradient(circle at 26% 66%, rgba(255,224,140,.68) 0 .8%, transparent 3.8%),
        radial-gradient(circle at 45% 5%, rgba(255,234,156,.72) 0 .7%, transparent 3.4%);
      mix-blend-mode: screen;
    }

    /* 地図上のタップ誘導：景色を邪魔しない、小さな暖色の光 */
    .beacon {
      position: absolute;
      z-index: 5;
      width: 15%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .beacon::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255,255,244,.98);
      box-shadow:
        0 0 0 2px rgba(255,255,255,.62),
        0 0 7px 3px rgba(255,224,112,.78),
        0 0 16px 7px rgba(255,205,76,.34);
      animation: beaconGlow 3.6s ease-in-out infinite;
      pointer-events: none;
    }
    .beacon:nth-of-type(3n)::before { animation-delay: -.8s; }
    .beacon:nth-of-type(3n+1)::before { animation-delay: -1.55s; }
    .beacon:focus-visible { outline: 2px dashed rgba(55,118,134,.72); outline-offset: -22px; }
    .beacon:active::before { transform: translate(-50%,-50%) scale(1.22); }

    .time-evening .beacon::before,
    .time-night .beacon::before {
      background: rgba(255,252,224,1);
      box-shadow:
        0 0 0 2px rgba(255,255,255,.72),
        0 0 8px 4px rgba(255,221,102,.9),
        0 0 18px 8px rgba(255,187,62,.42);
    }

    @keyframes beaconGlow {
      0%,100% {
        opacity: .42;
        transform: translate(-50%,-50%) scale(.72);
        filter: blur(.15px);
      }
      50% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.22);
        filter: blur(0);
      }
    }

    .dome-aura {
      position: absolute;
      z-index: 3;
      left: 67.5%;
      top: 29.2%;
      width: 27%;
      aspect-ratio: 1;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,250,205,.42), rgba(158,223,244,.14) 47%, transparent 72%);
      filter: blur(6px);
      animation: domeBreath 4.2s ease-in-out infinite;
    }
    @keyframes domeBreath {
      0%,100% { opacity: .45; transform: translate(-50%,-50%) scale(.94); }
      50% { opacity: .82; transform: translate(-50%,-50%) scale(1.05); }
    }

    /* 時間帯は描き分けた4枚の画像で表現します */
    .time-morning .ambient,
    .time-day .ambient,
    .time-evening .ambient,
    .time-night .ambient { background: transparent; }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(28,40,51,.09);
      backdrop-filter: blur(2.5px) saturate(.96);
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      z-index: 21;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      width: min(calc(100% - 42px), 430px);
      max-height: calc(100svh - 92px);
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translate(-50%, calc(100% + 28px));
      border-radius: 22px;
      background: linear-gradient(155deg, rgba(255,255,255,.94), rgba(245,251,253,.78));
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: 0 -18px 60px rgba(36,55,70,.20), inset 0 1px 0 rgba(255,255,255,.72);
      padding: 9px 15px 12px;
      opacity: 0;
      transition: transform .38s cubic-bezier(.18,.82,.24,1), opacity .26s ease;
    }
    .sheet.open { transform: translate(-50%,0); opacity: 1; }
    .handle { width: 30px; height: 4px; margin: 0 auto 8px; border-radius: 99px; background: rgba(49,71,95,.17); }
    .place-label { margin: 0; font-size: 9px; letter-spacing: .16em; opacity: .46; }
    .place-name { margin: 3px 0 0; font-family: Georgia, "Times New Roman", "Yu Mincho", serif; font-size: clamp(20px,5.4vw,25px); line-height: 1.16; letter-spacing: .055em; font-weight: 500; }
    .experience { margin: 5px 0 0; font-size: 10px; letter-spacing: .18em; color: #668092; font-weight: 700; }
    .place-copy { margin: 8px 0 0; max-width: 31em; font-size: 12px; line-height: 1.6; letter-spacing: .045em; color: rgba(49,71,95,.78); }
    .divider { height: 1px; margin: 10px 0 9px; background: linear-gradient(90deg,var(--line),transparent); }
    .song-label { margin: 0 0 2px; font-size: 9px; letter-spacing: .16em; opacity: .44; }
    .song-name { margin: 2px 0 9px; font-size: clamp(18px,5.1vw,23px); line-height: 1.25; font-weight: 660; letter-spacing: .015em; transition: opacity .18s ease, transform .22s ease; }
    .song-name.changing { opacity: 0; transform: translateY(4px); }
    .actions { display: grid; gap: 7px; }
    .move-next { width: 100%; min-height: 34px; border: 1px solid rgba(49,71,95,.14); border-radius: 13px; color: var(--ink); background: rgba(255,255,255,.48); font-size: 11px; font-weight: 650; letter-spacing: .08em; cursor: pointer; }
    .move-next:active, .next:active { transform: translateY(1px); }
    .services { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 8px; }
    .service {
      display: flex; align-items: center; justify-content: center;
      min-height: 34px; padding: 5px 3px;
      border: 1px solid rgba(49,71,95,.12); border-radius: 15px;
      color: var(--ink); text-decoration: none;
      background: rgba(255,255,255,.58);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.78);
      font-size: 10px; font-weight: 650;
    }
    .next { width: 100%; min-height: 42px; border: 0; border-radius: 15px; color: white; background: var(--ink); font-weight: 700; letter-spacing: .08em; cursor: pointer; }
    .close { display: block; margin: 4px auto 0; border: 0; background: transparent; color: var(--ink); opacity: .57; padding: 7px 14px; font-size: 12px; cursor: pointer; }

    .walk-status {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px));
      transform: translate(-50%, 16px);
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: calc(100% - 44px);
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 10px 30px rgba(39,61,78,.14);
      backdrop-filter: blur(10px);
      color: rgba(49,71,95,.78);
      font-size: 11px;
      letter-spacing: .06em;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease, transform .34s cubic-bezier(.18,.82,.24,1);
    }
    .walk-status.show { opacity: 1; transform: translate(-50%,0); }
    .walk-dots { display: inline-flex; gap: 3px; align-items: center; }
    .walk-dots i {
      width: 4px; height: 4px; border-radius: 50%;
      background: #7fa2b5; opacity: .35;
      animation: walkDot 1.05s ease-in-out infinite;
    }
    .walk-dots i:nth-child(2){ animation-delay:.16s; }
    .walk-dots i:nth-child(3){ animation-delay:.32s; }
    @keyframes walkDot { 0%,100%{transform:translateY(1px);opacity:.3} 50%{transform:translateY(-2px);opacity:1} }

    .beacon.arriving::before {
      animation: arrivalGlow 2.05s ease-in-out both;
    }
    .beacon.arriving::after {
      content:"";
      position:absolute; left:50%; top:50%;
      width:18px; height:18px; border-radius:50%;
      border:1px solid rgba(255,223,110,.82);
      transform:translate(-50%,-50%) scale(.4);
      opacity:0;
      animation: arrivalRing 2.05s ease-in-out both;
      pointer-events:none;
    }
    @keyframes arrivalGlow {
      0%{opacity:.35;transform:translate(-50%,-50%) scale(.72)}
      22%{opacity:1;transform:translate(-50%,-50%) scale(1.55)}
      44%{opacity:.52;transform:translate(-50%,-50%) scale(.88)}
      68%{opacity:1;transform:translate(-50%,-50%) scale(1.48)}
      100%{opacity:.72;transform:translate(-50%,-50%) scale(.92)}
    }
    @keyframes arrivalRing {
      0%,42%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
      12%,56%{opacity:.88}
      36%,82%{opacity:0;transform:translate(-50%,-50%) scale(2.75)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(2.75)}
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: #ffffff;
      transition: opacity .55s ease, visibility .55s ease;
    }
    .intro.hide { opacity: 0; visibility: hidden; }
    .intro-mark { text-align: center; }
    .intro-mark strong { display: block; font-family: Georgia,"Times New Roman",serif; font-size: 30px; font-weight: 500; letter-spacing: .14em; }
    .intro-snow-glow {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 12px auto 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      animation: introFlakeGlow 2.8s ease-in-out infinite;
    }
    .intro-snow-glow::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(176,229,250,.88) 0%, rgba(201,238,252,.56) 38%, rgba(225,247,255,.24) 60%, transparent 80%);
      filter: blur(8px);
    }
    .intro-snow {
      position: relative;
      z-index: 1;
      width: 31px;
      height: 31px;
      color: rgba(249,253,255,.96);
      filter:
        drop-shadow(0 0 2px rgba(255,255,255,1))
        drop-shadow(0 0 7px rgba(139,213,244,.96))
        drop-shadow(0 0 15px rgba(116,193,229,.72));
    }
    .intro-snow line {
      vector-effect: non-scaling-stroke;
      stroke: currentColor;
      stroke-width: .28;
      stroke-linecap: round;
    }
    @keyframes introFlakeGlow {
      0%,100% { opacity: .72; transform: scale(.985); }
      50% { opacity: 1; transform: scale(1.025); }
    }


    .sound-note {
      position: fixed;
      z-index: 60;
      left: 50%;
      top: max(58px, calc(env(safe-area-inset-top) + 38px));
      transform: translate(-50%,-8px);
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.86);
      color: #415a70;
      font-size: 10px;
      letter-spacing: .06em;
      box-shadow: 0 8px 24px rgba(29,48,67,.14);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .25s ease;
    }
    .sound-note.show { opacity: 1; transform: translate(-50%,0); }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .intro { display: none; }
    }
  </style>
</head>
<body>
  <div class="walk-status" id="walkStatus" aria-live="polite">
    <span id="walkText">次の景色へ</span>
    <span class="walk-dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>

  <div class="sound-note" id="soundNote" role="status" aria-live="polite"></div>

  <audio id="ambWind" src="ambient-wind.mp3" loop preload="auto"></audio>
  <audio id="ambWaves" src="ambient-waves.mp3" loop preload="auto"></audio>
  <audio id="ambBirds" src="ambient-birds.mp3" preload="auto"></audio>

  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-mark"><strong>SNOW MAP</strong><div class="intro-snow-glow"><svg class="intro-snow snowflake-svg" aria-hidden="true" viewBox="0 0 24 24"></svg></div></div>
  </div>

  <main class="app" id="app">
    <header class="topbar">
      <h1>SNOW MAP</h1>
      <p class="top-copy">今日は、どの景色を歩きますか。</p>
      <p class="hint" id="hint">小さく光る景色に触れてみてください</p>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="街の音をオンにする" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 10h3l4-3v10l-4-3H5z"/>
          <path d="M15 9.5c1.1 1.2 1.1 3.8 0 5"/>
          <path d="M17.5 7.5c2.2 2.4 2.2 6.6 0 9"/>
          <path class="sound-off-line" d="M4 4l16 16"/>
        </svg>
      </button>
    </header>

    <section class="map-viewport" aria-label="SNOW MAPの地図">
      <div class="map-stage">
        <div class="map-images" aria-label="海と街、Snow Dome、木漏れ日の道、はじまりの広場、ブルーハーバー、シーズンガーデンがつながるSNOW MAP">
          <img class="map-image active" id="mapImage" src="snow-map-day.png" alt="SNOW MAPの地図" />
        </div>
        <div class="ambient"></div>
        <div class="lights"></div>
        <div class="dome-aura" aria-hidden="true"></div>

        <button class="beacon" style="left:45.3%;top:5.2%;" data-place="展望台" aria-label="展望台"></button>
        <button class="beacon" style="left:39.2%;top:20.3%;" data-place="シティライト" aria-label="シティライト"></button>
        <button class="beacon" style="left:68.0%;top:29.3%;" data-place="Snow Dome" aria-label="Snow Dome"></button>
        <button class="beacon" style="left:21.2%;top:40.1%;" data-place="木漏れ日の道" aria-label="木漏れ日の道"></button>
        <button class="beacon" style="left:50.0%;top:36.9%;" data-place="歩道橋" aria-label="歩道橋"></button>
        <button class="beacon" style="left:67.3%;top:49.2%;" data-place="はじまりの広場" aria-label="はじまりの広場"></button>
        <button class="beacon" style="left:72.1%;top:59.2%;" data-place="カフェ" aria-label="カフェ"></button>
        <button class="beacon" style="left:25.8%;top:65.7%;" data-place="ブルーハーバー" aria-label="ブルーハーバー"></button>
        <button class="beacon" style="left:70.2%;top:73.2%;" data-place="シーサイド" aria-label="シーサイド"></button>
        <button class="beacon" style="left:38.8%;top:74.4%;" data-place="シーズンガーデン" aria-label="シーズンガーデン"></button>
      </div>
    </section>
  </main>

  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="songName">
    <div class="handle"></div>
    <p class="place-label">PLACE</p>
    <p class="place-name" id="placeName"></p>
    <p class="experience" id="experience"></p>
    <p class="place-copy" id="placeCopy"></p>
    <div class="divider"></div>
    <p class="song-label">MUSIC</p>
    <h2 class="song-name" id="songName"></h2>
    <div class="services">
      <a class="service" id="spotifyLink" target="_blank" rel="noopener">Spotify</a>
      <a class="service" id="appleLink" target="_blank" rel="noopener">Apple Music</a>
      <a class="service" id="youtubeLink" target="_blank" rel="noopener">YouTube</a>
    </div>
    <div class="actions">
      <button class="next" id="exploreButton">この場所を散策する</button>
      <button class="move-next" id="nextButton">次の景色へ</button>
    </div>
    <button class="close" id="closeButton">地図へ戻る</button>
  </section>

  <script>
    "use strict";

    const snowflakeLines = [
      [12,3,12,21],[4.2,7.5,19.8,16.5],[4.2,16.5,19.8,7.5],
      [12,3,10.6,5.2],[12,3,13.4,5.2],[12,21,10.6,18.8],[12,21,13.4,18.8],
      [4.2,7.5,6.9,7.8],[4.2,7.5,5.4,9.8],[19.8,16.5,17.1,16.2],[19.8,16.5,18.6,14.2],
      [4.2,16.5,6.9,16.2],[4.2,16.5,5.4,14.2],[19.8,7.5,17.1,7.8],[19.8,7.5,18.6,9.8]
    ];
    function drawSnowflake(svg){
      const ns="http://www.w3.org/2000/svg";
      snowflakeLines.forEach(([x1,y1,x2,y2])=>{
        const line=document.createElementNS(ns,"line");
        line.setAttribute("x1",x1); line.setAttribute("y1",y1); line.setAttribute("x2",x2); line.setAttribute("y2",y2);
        svg.appendChild(line);
      });
    }
    document.querySelectorAll(".snowflake-svg").forEach(drawSnowflake);

    const places = {
      "展望台": {
        verb:"見つける",
        copy:"高く登れば、まだ知らない景色が見えてくる。",
        songs:["We'll go together","EVERYTHING IS EVERYTHING","星のうた","7%","SBY"],
        next:["歩道橋","シティライト","ブルーハーバー"]
      },
      "シティライト": {
        verb:"駆け抜ける",
        copy:"光あふれる街は、今日も前へ進み続ける。",
        songs:["Spark!!","BANG‼︎","I・だって止まらない","SAVE YOUR HEART","W"],
        next:["歩道橋","Snow Dome","展望台","ブルーハーバー"]
      },
      "Snow Dome": {
        verb:"熱くなる",
        copy:"光も歓声も、この街でいちばん熱い場所。",
        songs:["P.M.G.","Party! Party! Party!","Crazy F-R-E-S-H Beat","Make It Hot","守りたい、その笑顔"],
        next:["はじまりの広場","シティライト","歩道橋"]
      },
      "木漏れ日の道": {
        verb:"歩き出す",
        copy:"風に背中を押されて、また少し前へ。",
        songs:["From Today","A PIECE OF CAKE","Brand New Smile","TIKI TIKI","Days"],
        next:["歩道橋","はじまりの広場","ブルーハーバー","シーズンガーデン"]
      },
      "歩道橋": {
        verb:"踏み出す",
        copy:"一歩先へ。景色は歩いた人だけに見えてくる。",
        songs:["オトノナルホウヘ","Don't Hold Back","グッタイム","iro iro","ファンターナモーレ"],
        next:["展望台","シティライト","Snow Dome","木漏れ日の道","はじまりの広場"]
      },
      "はじまりの広場": {
        verb:"出会う",
        copy:"今日の景色は、ここから動き始める。",
        songs:["Snow World","Happy Birthday","NO SURRENDER！","ナミダの海を越えて行け","ブラザービート"],
        next:["Snow Dome","木漏れ日の道","カフェ","歩道橋"]
      },
      "カフェ": {
        verb:"整える",
        copy:"少しだけ立ち止まれば、次の景色がもっと楽しみになる。",
        songs:["ANY & EVERY","Luv Classic","Big Bang Sweet","What's your color?","Color me live..."],
        next:["はじまりの広場","木漏れ日の道","シーズンガーデン","シーサイド"]
      },
      "ブルーハーバー": {
        verb:"旅立つ",
        copy:"潮風に乗って、新しい景色へ漕ぎ出そう。",
        songs:["Lock on!","Wonderful! × Surprise!","Ready Go Round","ミッドナイト・トレンディ","8月の青"],
        next:["シーサイド","木漏れ日の道","展望台","シティライト"]
      },
      "シーサイド": {
        verb:"風を受ける",
        copy:"波と風が、心まで走らせてくれる。",
        songs:["Stories","REFRESH","YumYumYum 〜SpicyGirl〜","DA BOMB","Hip bounce!!"],
        next:["ブルーハーバー","シーズンガーデン","カフェ","シティライト"]
      },
      "シーズンガーデン": {
        verb:"巡る",
        copy:"季節が変わるたび、この街も少しずつ表情を変える。",
        songs:["HELLO HELLO","オレンジkiss","君は僕のもの","いっそ、嫌いになれたら。","My Sweet Girl"],
        next:["シーサイド","カフェ","木漏れ日の道","はじまりの広場"]
      }
    };

    const app=document.getElementById("app"), intro=document.getElementById("intro"), hint=document.getElementById("hint");
    const themeColor=document.getElementById("themeColor");
    const mapImage=document.getElementById("mapImage");
    const timeImages={
      morning:"snow-map-morning.png",
      day:"snow-map-day.png",
      evening:"snow-map-evening.png",
      night:"snow-map-night.png"
    };
    let currentTimeKey=null;
    const sheet=document.getElementById("sheet"), backdrop=document.getElementById("backdrop");
    const placeName=document.getElementById("placeName"), experience=document.getElementById("experience"), placeCopy=document.getElementById("placeCopy"), songName=document.getElementById("songName");
    const exploreButton=document.getElementById("exploreButton"), nextButton=document.getElementById("nextButton"), closeButton=document.getElementById("closeButton");
    const walkStatus=document.getElementById("walkStatus"), walkText=document.getElementById("walkText");
    const mapViewport=document.querySelector(".map-viewport");
    const mapStage=document.querySelector(".map-stage");
    const spotifyLink=document.getElementById("spotifyLink"), appleLink=document.getElementById("appleLink"), youtubeLink=document.getElementById("youtubeLink");
    const soundToggle=document.getElementById("soundToggle"), soundNote=document.getElementById("soundNote");
    const ambWind=document.getElementById("ambWind"), ambWaves=document.getElementById("ambWaves"), ambBirds=document.getElementById("ambBirds");

    // Soundscape engine v1
    // 現在同梱している音源：wind / waves / birds
    // 将来は下記のファイルを追加し、SOUND_ASSETSへ登録するだけで拡張できます。
    // ambient-leaves.mp3 / ambient-car-1.mp3 / ambient-car-2.mp3 /
    // ambient-fountain.mp3 / ambient-city.mp3 / ambient-cafe.mp3 /
    // ambient-crowd-light.mp3 / ambient-cheer-far.mp3 / ambient-horn-far.mp3
    const SOUND_ASSETS={
      wind:{audio:ambWind,kind:"loop"},
      waves:{audio:ambWaves,kind:"loop"},
      birds:{audio:ambBirds,kind:"event"}
    };
    const ambientTracks=[ambWind,ambWaves];
    let currentPlace=null, previousSong=null, isTransitioning=false, isZoomed=false, soundEnabled=false, soundNoteTimer=null;
    let eventTimers={birds:null}, eventStopTimers={birds:null};
    const songQueues = {};
    const strollSteps = {};
    const strollViews = [
      {dx:-8.5, dy:-5.5, scale:1.48},
      {dx: 8.0, dy:-3.0, scale:1.45},
      {dx: 6.0, dy: 6.0, scale:1.50},
      {dx:-7.0, dy: 5.0, scale:1.46},
      {dx: 0.0, dy:-7.0, scale:1.51}
    ];

    function showSoundNote(message){
      soundNote.textContent=message;
      soundNote.classList.add("show");
      clearTimeout(soundNoteTimer);
      soundNoteTimer=setTimeout(()=>soundNote.classList.remove("show"),1500);
    }
    function timeBand(){
      const h=new Date().getHours();
      if(h>=5&&h<11) return "morning";
      if(h>=11&&h<16) return "day";
      if(h>=16&&h<19) return "evening";
      return "night";
    }
    function setTrackVolume(track,value,duration=1400){
      if(!track) return;
      const start=Number.isFinite(track.volume)?track.volume:0;
      const target=Math.max(0,Math.min(1,value));
      const t0=performance.now();
      function step(now){
        const t=Math.min(1,(now-t0)/duration);
        const eased=t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
        track.volume=start+(target-start)*eased;
        if(t<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    function baseMix(place=currentPlace){
      const band=timeBand();
      const sea=["ブルーハーバー","シーサイド"].includes(place);
      const nearSea=["展望台","シーズンガーデン","はじまりの広場"].includes(place);
      const sheltered=["カフェ","木漏れ日の道"].includes(place);
      const city=["シティライト","歩道橋","Snow Dome"].includes(place);
      let wind={morning:.115,day:.105,evening:.145,night:.085}[band];
      if(sea||place==="展望台") wind+=.035;
      if(sheltered) wind-=.035;
      if(city) wind-=.015;
      let waves=sea ? (place==="シーサイド"?.19:.15) : nearSea?.045:.012;
      if(band==="night") waves*=.82;
      if(band==="evening") waves*=1.08;
      return {wind:Math.max(.025,wind),waves};
    }
    function clearEvent(name){
      clearTimeout(eventTimers[name]);
      clearTimeout(eventStopTimers[name]);
      eventTimers[name]=null; eventStopTimers[name]=null;
      const audio=SOUND_ASSETS[name]?.audio;
      if(audio){ audio.pause(); audio.volume=0; }
    }
    function birdsAllowed(place=currentPlace){
      const band=timeBand();
      return band!=="night" && ["ブルーハーバー","シーサイド","展望台","木漏れ日の道","シーズンガーデン"].includes(place);
    }
    function scheduleBirds(place=currentPlace,first=false){
      clearEvent("birds");
      if(!soundEnabled || !birdsAllowed(place)) return;
      const band=timeBand();
      const delay=first ? 7000+Math.random()*9000 : (band==="morning"?18000:28000)+Math.random()*(band==="morning"?24000:38000);
      eventTimers.birds=setTimeout(async()=>{
        if(!soundEnabled || !birdsAllowed(currentPlace)) return;
        const audio=ambBirds;
        try{
          const duration=Number.isFinite(audio.duration)?audio.duration:24;
          audio.currentTime=Math.max(0,Math.random()*Math.max(1,duration-4));
          audio.playbackRate=.94+Math.random()*.09;
          audio.volume=(band==="morning"?.018:.012)+Math.random()*.007;
          await audio.play();
          eventStopTimers.birds=setTimeout(()=>{
            audio.pause(); audio.volume=0;
            scheduleBirds(currentPlace,false);
          },1300+Math.random()*1700);
        }catch(_){ scheduleBirds(currentPlace,false); }
      },delay);
    }
    function ambientMix(place=currentPlace,{duration=1700}={}){
      if(!soundEnabled) return;
      const mix=baseMix(place);
      setTrackVolume(ambWind,mix.wind,duration);
      setTrackVolume(ambWaves,mix.waves,duration);
      scheduleBirds(place,true);
    }
    async function enableAmbient(){
      try{
        ambientTracks.forEach(t=>{t.volume=0;t.playbackRate=1;});
        await Promise.all(ambientTracks.map(t=>t.play()));
        soundEnabled=true;
        soundToggle.classList.add("on");
        soundToggle.setAttribute("aria-pressed","true");
        soundToggle.setAttribute("aria-label","街の音をオフにする");
        ambientMix(currentPlace,{duration:1100});
        showSoundNote("街の音をオンにしました");
      }catch(err){
        showSoundNote("音声を再生できませんでした");
      }
    }
    function disableAmbient(){
      soundEnabled=false;
      clearEvent("birds");
      ambientTracks.forEach(t=>{
        setTrackVolume(t,0,500);
        setTimeout(()=>t.pause(),560);
      });
      soundToggle.classList.remove("on");
      soundToggle.setAttribute("aria-pressed","false");
      soundToggle.setAttribute("aria-label","街の音をオンにする");
      showSoundNote("街の音をオフにしました");
    }
    function toggleAmbient(){ soundEnabled ? disableAmbient() : enableAmbient(); }

    function getTimeKey(){
      const h=new Date().getHours();
      if(h>=5&&h<11) return "morning";
      if(h>=11&&h<16) return "day";
      if(h>=16&&h<19) return "evening";
      return "night";
    }
    const skyStops=[
      {m:0,    top:"#17263a", mid:"#1d3048", bottom:"#243b55", text:"#f3f7fb", muted:"#aebfd0"},
      {m:240,  top:"#263b56", mid:"#365673", bottom:"#71899d", text:"#edf4fa", muted:"#c3d1dd"},
      {m:300,  top:"#8499aa", mid:"#b7cad7", bottom:"#e2edf2", text:"#415b72", muted:"#71879a"},
      {m:360,  top:"#e9dfe1", mid:"#e8f2f7", bottom:"#eef8fb", text:"#31475f", muted:"#718293"},
      {m:480,  top:"#eef7fa", mid:"#f5fafb", bottom:"#f8fbfb", text:"#31475f", muted:"#758696"},
      {m:660,  top:"#f8fbfb", mid:"#f8fbfb", bottom:"#f5f9fa", text:"#31475f", muted:"#758696"},
      {m:960,  top:"#f5e8e4", mid:"#f4e5e1", bottom:"#f0dedb", text:"#31475f", muted:"#7f7376"},
      {m:1080, top:"#d9c5cb", mid:"#c7bdcc", bottom:"#aeb4c5", text:"#425066", muted:"#687389"},
      {m:1140, top:"#586b84", mid:"#445a73", bottom:"#334a63", text:"#edf4fa", muted:"#bdcbd8"},
      {m:1260, top:"#314762", mid:"#293e58", bottom:"#22364e", text:"#f3f7fb", muted:"#bac8d5"},
      {m:1440, top:"#17263a", mid:"#1d3048", bottom:"#243b55", text:"#f3f7fb", muted:"#aebfd0"}
    ];
    function hexToRgb(hex){
      const n=parseInt(hex.slice(1),16);
      return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
    }
    function mixHex(a,b,t){
      const A=hexToRgb(a),B=hexToRgb(b);
      const c=k=>Math.round(A[k]+(B[k]-A[k])*t).toString(16).padStart(2,"0");
      return `#${c("r")}${c("g")}${c("b")}`;
    }
    function skyAt(minute){
      let i=0;
      while(i<skyStops.length-1 && minute>skyStops[i+1].m) i++;
      const a=skyStops[i], b=skyStops[Math.min(i+1,skyStops.length-1)];
      const span=Math.max(1,b.m-a.m), t=Math.max(0,Math.min(1,(minute-a.m)/span));
      return {
        top:mixHex(a.top,b.top,t), mid:mixHex(a.mid,b.mid,t), bottom:mixHex(a.bottom,b.bottom,t),
        text:mixHex(a.text,b.text,t), muted:mixHex(a.muted,b.muted,t)
      };
    }
    function setSkyGradient(now=new Date()){
      const minute=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
      const sky=skyAt(minute);
      const root=document.documentElement.style;
      root.setProperty("--world-top",sky.top);
      root.setProperty("--world-mid",sky.mid);
      root.setProperty("--world-bottom",sky.bottom);
      root.setProperty("--top-ink",sky.text);
      root.setProperty("--top-muted",sky.muted);
      const nightFactor = minute>=1140 ? Math.min(1,(minute-1140)/240) : minute<300 ? 1-(minute/300) : 0;
      const lightAlpha = 0.10 + Math.max(0,nightFactor)*0.34;
      const lightSpread = 0.75 + Math.max(0,nightFactor)*0.55;
      root.setProperty("--night-light-alpha", lightAlpha.toFixed(3));
      root.setProperty("--night-light-spread", lightSpread.toFixed(3));
      document.documentElement.style.backgroundColor=sky.bottom;
      document.body.style.backgroundColor=sky.bottom;
      themeColor?.setAttribute("content",sky.bottom);
    }
    function setWorldTime(){
      const now=new Date();
      setSkyGradient(now);
      const key=getTimeKey();
      app.classList.remove("time-morning","time-day","time-evening","time-night");
      document.body.classList.remove("time-morning","time-day","time-evening","time-night");
      app.classList.add(`time-${key}`);
      document.body.classList.add(`time-${key}`);
      if(key===currentTimeKey) return;
      currentTimeKey=key;
      const nextSrc=timeImages[key];
      const preload=new Image();
      preload.onload=()=>{
        mapImage.classList.add("switching");
        setTimeout(()=>{
          mapImage.src=nextSrc;
          requestAnimationFrame(()=>mapImage.classList.remove("switching"));
        },260);
      };
      preload.src=nextSrc;
    }
    function pick(list,excluded=null){ const c=list.filter(x=>x!==excluded); const p=c.length?c:list; return p[Math.floor(Math.random()*p.length)]; }
    function updateLinks(title){ const q=encodeURIComponent(`Snow Man ${title}`); spotifyLink.href=`https://open.spotify.com/search/${q}`; appleLink.href=`https://music.apple.com/jp/search?term=${q}`; youtubeLink.href=`https://www.youtube.com/results?search_query=${q}`; }
    function shuffled(list){
      const copy=[...list];
      for(let i=copy.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [copy[i],copy[j]]=[copy[j],copy[i]];
      }
      return copy;
    }
    function nextSongFor(place){
      const songs=places[place].songs;
      if(!songQueues[place] || songQueues[place].length===0){
        songQueues[place]=shuffled(songs);
        if(songQueues[place][0]===previousSong && songQueues[place].length>1){
          songQueues[place].push(songQueues[place].shift());
        }
      }
      return songQueues[place].shift();
    }
    function renderSong(song,{animate=false}={}){
      const apply=()=>{
        previousSong=song;
        songName.textContent=song;
        updateLinks(song);
        songName.classList.remove("changing");
      };
      if(!animate){ apply(); return; }
      songName.classList.add("changing");
      setTimeout(apply,180);
    }
    function showSong(place){
      currentPlace=place;
      ambientMix(place,{duration:1900});
      const data=places[place], song=nextSongFor(place);
      placeName.textContent=place;
      experience.textContent=data.verb;
      placeCopy.textContent=data.copy;
      renderSong(song);
      exploreButton.textContent="この場所を散策する";
      document.body.style.overflow="hidden";
      hint.style.opacity="0";
      backdrop.classList.add("open");
      sheet.classList.remove("open");
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>sheet.classList.add("open"));
      });
    }
    function exploreCurrentPlace(){
      if(!currentPlace || isTransitioning) return;
      isTransitioning=true;
      const song=nextSongFor(currentPlace);
      const beacon=getBeacon(currentPlace);

      // いったんカードとぼかしを消し、景色だけを見る時間をつくる
      sheet.classList.remove("open");
      backdrop.classList.remove("open");
      document.body.style.overflow="";

      setTimeout(()=>{
        // 約0.6秒、景色だけを見せたあと、同じ場所の中をゆっくり大きく散策する
        if(beacon){
          const baseX=parseFloat(beacon.style.left||"50");
          const baseY=parseFloat(beacon.style.top||"50");
          const step=strollSteps[currentPlace]||0;
          const view=strollViews[step % strollViews.length];
          strollSteps[currentPlace]=step+1;
          const x=Math.max(8,Math.min(92,baseX+view.dx));
          const y=Math.max(8,Math.min(92,baseY+view.dy));
          mapStage.style.setProperty("--stroll-scale", String(view.scale));
          mapStage.classList.add("strolling");
          setMapFocus(x,y);
        }

        setTimeout(()=>{
          renderSong(song);
          exploreButton.textContent="もう少し散策する";
          document.body.style.overflow="hidden";
          backdrop.classList.add("open");
          requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add("open")));
          mapStage.classList.remove("strolling");
          isTransitioning=false;
        },2550);
      },900);
    }
    function getBeacon(place){
      return [...document.querySelectorAll(".beacon")].find(b=>b.dataset.place===place);
    }
    function centerBeacon(beacon, behavior="smooth"){
      if(!beacon) return;
      const rect=beacon.getBoundingClientRect();
      const targetY=window.scrollY + rect.top + rect.height/2 - window.innerHeight*.43;
      window.scrollTo({top:Math.max(0,targetY),behavior});
    }
    function setMapFocus(x,y){
      if(!mapStage) return;
      const stageWidth=mapStage.offsetWidth || 1;
      const viewportWidth=mapViewport?.clientWidth || stageWidth;
      const targetX=stageWidth*(x/100);
      const panX=viewportWidth/2-targetX;
      mapStage.style.setProperty("--walk-x", `${x}%`);
      mapStage.style.setProperty("--walk-y", `${y}%`);
      mapStage.style.setProperty("--pan-x", `${panX}px`);
    }
    function setWalkFocus(beacon){
      if(!beacon || !mapStage) return;
      const x=parseFloat(beacon.style.left || "50");
      const y=parseFloat(beacon.style.top || "50");
      setMapFocus(x,y);
    }
    function closeSheet({keepZoom=true}={}){
      sheet.classList.remove("open");
      backdrop.classList.remove("open");
      document.body.style.overflow="";
      if(!keepZoom) returnToMap();
    }

    function returnToMap(){
      isZoomed=false;
      mapStage?.classList.remove("walking");
      mapStage?.style.setProperty("--walk-x", "50%");
      mapStage?.style.setProperty("--walk-y", "50%");
      mapStage?.style.setProperty("--pan-x", "0px");
      window.scrollTo({top:0, behavior:"smooth"});
      hint.style.opacity=".5";
    }

    function arriveAt(place,{fromMap=false}={}){
      if(isTransitioning) return;
      const beacon=getBeacon(place);
      if(!beacon) return;
      isTransitioning=true;
      currentPlace=place;
      ambientMix(place,{duration:2400});
      closeSheet({keepZoom:true});
      walkText.textContent=fromMap ? `${place}へ` : `${place}へ歩いています`;
      walkStatus.classList.add("show");
      setWalkFocus(beacon);
      isZoomed=true;
      requestAnimationFrame(()=>mapStage?.classList.add("walking"));
      setTimeout(()=>centerBeacon(beacon),90);
      setTimeout(()=>beacon.classList.add("arriving"),2180);
      setTimeout(()=>{
        walkStatus.classList.remove("show");
        beacon.classList.remove("arriving");
        showSong(place);
        isTransitioning=false;
      },4850);
    }

    function continueWalk(){
      if(!currentPlace || isTransitioning) return;
      const destination=pick(places[currentPlace].next);
      arriveAt(destination,{fromMap:false});
    }

    document.querySelectorAll(".beacon").forEach(b=>{
      b.addEventListener("click",()=>arriveAt(b.dataset.place,{fromMap:!isZoomed}));
    });
    soundToggle.addEventListener("click",toggleAmbient);
    exploreButton.addEventListener("click",exploreCurrentPlace);
    nextButton.addEventListener("click",continueWalk);
    closeButton.addEventListener("click",()=>closeSheet({keepZoom:false}));
    backdrop.addEventListener("click",()=>closeSheet({keepZoom:true}));
    document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet({keepZoom:true}); });
    setWorldTime(); setInterval(()=>{ setWorldTime(); if(soundEnabled) ambientMix(currentPlace,{duration:60000}); },60000);
    window.addEventListener("resize",()=>{
      if(isZoomed && currentPlace){
        const beacon=getBeacon(currentPlace);
        if(beacon) setWalkFocus(beacon);
      }
    });
    window.addEventListener("load",()=>setTimeout(()=>intro.classList.add("hide"),2000));
  </script>
</body>
