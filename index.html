<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="themeColor" content="#f8fbfb" />
  <title>SNOW MAP</title>
  <!-- SNOW MAP v0.6.3: カード点滅修正・次の景色へ・時間連動背景 -->
  <style>
    :root {
      --ink: #31475f;
      --paper: #ffffff;
      --panel: rgba(255,255,255,.88);
      --line: rgba(49,71,95,.14);
      --shadow: 0 18px 48px rgba(47,70,88,.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--world-bg, var(--paper));
      transition: background-color .75s ease;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      overflow-x: hidden;
    }
    button, a { font: inherit; }

    .app {
      width: min(100%, 560px);
      background: var(--world-bg, transparent);
      transition: background-color .75s ease;
      min-height: 100svh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
    }

    .topbar {
      position: relative;
      z-index: 10;
      padding: 3px 22px 4px;
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 7.4vw, 36px);
      font-weight: 500;
      letter-spacing: .13em;
    }
    .top-copy {
      margin: 4px 0 0;
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: .05em;
      font-weight: 520;
    }
    .hint {
      margin: 1px 0 0;
      font-size: 10px;
      letter-spacing: .07em;
      opacity: .5;
      transition: opacity .35s ease;
    }

    .map-viewport {
      position: relative;
      width: 100%;
      margin-top: -2px;
      overflow: hidden;
      isolation: isolate;
      background: transparent;
    }


    body.time-morning, .app.time-morning { --world-bg: #eef8fb; }
    body.time-day, .app.time-day { --world-bg: #f8fbfb; }
    body.time-evening, .app.time-evening { --world-bg: #f6ece8; }
    body.time-night, .app.time-night { --world-bg: #26394c; }

    .map-stage {
      position: relative;
      width: 112%;
      margin-left: -6%;
      transform: scale(1);
      transform-origin: var(--walk-x, 50%) var(--walk-y, 50%);
      transition: transform 1.05s cubic-bezier(.22,.72,.22,1), transform-origin 1.05s cubic-bezier(.22,.72,.22,1);
      will-change: transform;
    }
    .map-stage.walking {
      transform: scale(1.28);
    }

    .map-images {
      position: relative;
      width: 100%;
    }
    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 1;
      transition: opacity .65s ease;
    }
    .map-image.switching { opacity: 0; }

    .ambient,
    .lights {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .ambient { z-index: 2; transition: background .8s ease; }
    .lights { z-index: 4; }

    /* 地図上のタップ誘導：景色を邪魔しない、小さな暖色の光 */
    .beacon {
      position: absolute;
      z-index: 5;
      width: 15%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .beacon::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255,255,244,.98);
      box-shadow:
        0 0 0 2px rgba(255,255,255,.62),
        0 0 7px 3px rgba(255,224,112,.78),
        0 0 16px 7px rgba(255,205,76,.34);
      animation: beaconGlow 2.7s ease-in-out infinite;
      pointer-events: none;
    }
    .beacon:nth-of-type(3n)::before { animation-delay: -.8s; }
    .beacon:nth-of-type(3n+1)::before { animation-delay: -1.55s; }
    .beacon:focus-visible { outline: 2px dashed rgba(55,118,134,.72); outline-offset: -22px; }
    .beacon:active::before { transform: translate(-50%,-50%) scale(1.22); }

    .time-evening .beacon::before,
    .time-night .beacon::before {
      background: rgba(255,252,224,1);
      box-shadow:
        0 0 0 2px rgba(255,255,255,.72),
        0 0 8px 4px rgba(255,221,102,.9),
        0 0 18px 8px rgba(255,187,62,.42);
    }

    @keyframes beaconGlow {
      0%,100% {
        opacity: .58;
        transform: translate(-50%,-50%) scale(.78);
      }
      50% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.08);
      }
    }

    .dome-aura {
      position: absolute;
      z-index: 3;
      left: 67.5%;
      top: 29.2%;
      width: 27%;
      aspect-ratio: 1;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,250,205,.42), rgba(158,223,244,.14) 47%, transparent 72%);
      filter: blur(6px);
      animation: domeBreath 4.2s ease-in-out infinite;
    }
    @keyframes domeBreath {
      0%,100% { opacity: .45; transform: translate(-50%,-50%) scale(.94); }
      50% { opacity: .82; transform: translate(-50%,-50%) scale(1.05); }
    }

    /* 時間帯は描き分けた4枚の画像で表現します */
    .time-morning .ambient,
    .time-day .ambient,
    .time-evening .ambient,
    .time-night .ambient { background: transparent; }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(28,40,51,.14);
      backdrop-filter: blur(7px) saturate(.92);
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      z-index: 21;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      width: min(calc(100% - 42px), 430px);
      max-height: calc(100svh - 92px);
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translate(-50%, calc(100% + 28px));
      border-radius: 22px;
      background: linear-gradient(155deg, rgba(255,255,255,.94), rgba(245,251,253,.78));
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: 0 -18px 60px rgba(36,55,70,.20), inset 0 1px 0 rgba(255,255,255,.72);
      padding: 9px 15px 12px;
      opacity: 0;
      transition: transform .38s cubic-bezier(.18,.82,.24,1), opacity .26s ease;
    }
    .sheet.open { transform: translate(-50%,0); opacity: 1; }
    .handle { width: 30px; height: 4px; margin: 0 auto 8px; border-radius: 99px; background: rgba(49,71,95,.17); }
    .place-label { margin: 0; font-size: 9px; letter-spacing: .16em; opacity: .46; }
    .place-name { margin: 3px 0 0; font-family: Georgia, "Times New Roman", "Yu Mincho", serif; font-size: clamp(20px,5.4vw,25px); line-height: 1.16; letter-spacing: .055em; font-weight: 500; }
    .experience { margin: 5px 0 0; font-size: 10px; letter-spacing: .18em; color: #668092; font-weight: 700; }
    .place-copy { margin: 8px 0 0; max-width: 31em; font-size: 12px; line-height: 1.6; letter-spacing: .045em; color: rgba(49,71,95,.78); }
    .divider { height: 1px; margin: 10px 0 9px; background: linear-gradient(90deg,var(--line),transparent); }
    .song-label { margin: 0 0 2px; font-size: 9px; letter-spacing: .16em; opacity: .44; }
    .song-name { margin: 2px 0 9px; font-size: clamp(18px,5.1vw,23px); line-height: 1.25; font-weight: 660; letter-spacing: .015em; }
    .services { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 8px; }
    .service {
      display: flex; align-items: center; justify-content: center;
      min-height: 34px; padding: 5px 3px;
      border: 1px solid rgba(49,71,95,.12); border-radius: 15px;
      color: var(--ink); text-decoration: none;
      background: rgba(255,255,255,.58);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.78);
      font-size: 10px; font-weight: 650;
    }
    .next { width: 100%; min-height: 42px; border: 0; border-radius: 15px; color: white; background: var(--ink); font-weight: 700; letter-spacing: .08em; cursor: pointer; }
    .close { display: block; margin: 4px auto 0; border: 0; background: transparent; color: var(--ink); opacity: .57; padding: 7px 14px; font-size: 12px; cursor: pointer; }

    .walk-status {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px));
      transform: translate(-50%, 16px);
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: calc(100% - 44px);
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 10px 30px rgba(39,61,78,.14);
      backdrop-filter: blur(10px);
      color: rgba(49,71,95,.78);
      font-size: 11px;
      letter-spacing: .06em;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease, transform .34s cubic-bezier(.18,.82,.24,1);
    }
    .walk-status.show { opacity: 1; transform: translate(-50%,0); }
    .walk-dots { display: inline-flex; gap: 3px; align-items: center; }
    .walk-dots i {
      width: 4px; height: 4px; border-radius: 50%;
      background: #7fa2b5; opacity: .35;
      animation: walkDot 1.05s ease-in-out infinite;
    }
    .walk-dots i:nth-child(2){ animation-delay:.16s; }
    .walk-dots i:nth-child(3){ animation-delay:.32s; }
    @keyframes walkDot { 0%,100%{transform:translateY(1px);opacity:.3} 50%{transform:translateY(-2px);opacity:1} }

    .beacon.arriving::before {
      animation: arrivalGlow 2.05s ease-in-out both;
    }
    .beacon.arriving::after {
      content:"";
      position:absolute; left:50%; top:50%;
      width:18px; height:18px; border-radius:50%;
      border:1px solid rgba(255,223,110,.82);
      transform:translate(-50%,-50%) scale(.4);
      opacity:0;
      animation: arrivalRing 2.05s ease-in-out both;
      pointer-events:none;
    }
    @keyframes arrivalGlow {
      0%{opacity:.35;transform:translate(-50%,-50%) scale(.72)}
      22%{opacity:1;transform:translate(-50%,-50%) scale(1.55)}
      44%{opacity:.52;transform:translate(-50%,-50%) scale(.88)}
      68%{opacity:1;transform:translate(-50%,-50%) scale(1.48)}
      100%{opacity:.72;transform:translate(-50%,-50%) scale(.92)}
    }
    @keyframes arrivalRing {
      0%,42%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
      12%,56%{opacity:.88}
      36%,82%{opacity:0;transform:translate(-50%,-50%) scale(2.75)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(2.75)}
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: #ffffff;
      transition: opacity .55s ease, visibility .55s ease;
    }
    .intro.hide { opacity: 0; visibility: hidden; }
    .intro-mark { text-align: center; }
    .intro-mark strong { display: block; font-family: Georgia,"Times New Roman",serif; font-size: 30px; font-weight: 500; letter-spacing: .14em; }
    .intro-snow-glow {
      position: relative;
      width: 58px;
      height: 58px;
      margin: 12px auto 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      animation: introFlakeGlow 2.8s ease-in-out infinite;
    }
    .intro-snow-glow::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(181,224,242,.70) 0%, rgba(210,239,250,.34) 44%, transparent 74%);
      filter: blur(6px);
    }
    .intro-snow {
      position: relative;
      z-index: 1;
      width: 34px;
      height: 34px;
      color: rgba(178,211,225,.82);
      filter: drop-shadow(0 0 1px rgba(255,255,255,.98)) drop-shadow(0 0 8px rgba(139,205,233,.72));
    }
    .intro-snow line {
      vector-effect: non-scaling-stroke;
      stroke: currentColor;
      stroke-width: .55;
      stroke-linecap: round;
    }
    @keyframes introFlakeGlow {
      0%,100% { opacity: .64; transform: scale(.97); }
      50% { opacity: 1; transform: scale(1.035); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .intro { display: none; }
    }
  </style>
</head>
<body>
  <div class="walk-status" id="walkStatus" aria-live="polite">
    <span id="walkText">次の景色へ</span>
    <span class="walk-dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>

  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-mark"><strong>SNOW MAP</strong><div class="intro-snow-glow"><svg class="intro-snow snowflake-svg" aria-hidden="true" viewBox="0 0 24 24"></svg></div></div>
  </div>

  <main class="app" id="app">
    <header class="topbar">
      <h1>SNOW MAP</h1>
      <p class="top-copy">今日は、どの景色を歩きますか。</p>
      <p class="hint" id="hint">小さく光る景色に触れてみてください</p>
    </header>

    <section class="map-viewport" aria-label="SNOW MAPの地図">
      <div class="map-stage">
        <div class="map-images" aria-label="海と街、Snow Dome、木漏れ日の道、はじまりの広場、ブルーハーバー、シーズンガーデンがつながるSNOW MAP">
          <img class="map-image active" id="mapImage" src="snow-map-day.png" alt="SNOW MAPの地図" />
        </div>
        <div class="ambient"></div>
        <div class="lights"></div>
        <div class="dome-aura" aria-hidden="true"></div>

        <button class="beacon" style="left:45.3%;top:5.2%;" data-place="展望台" aria-label="展望台"></button>
        <button class="beacon" style="left:39.2%;top:20.3%;" data-place="シティライト" aria-label="シティライト"></button>
        <button class="beacon" style="left:68.0%;top:29.3%;" data-place="Snow Dome" aria-label="Snow Dome"></button>
        <button class="beacon" style="left:21.2%;top:40.1%;" data-place="木漏れ日の道" aria-label="木漏れ日の道"></button>
        <button class="beacon" style="left:50.0%;top:36.9%;" data-place="歩道橋" aria-label="歩道橋"></button>
        <button class="beacon" style="left:67.3%;top:49.2%;" data-place="はじまりの広場" aria-label="はじまりの広場"></button>
        <button class="beacon" style="left:72.1%;top:59.2%;" data-place="カフェ" aria-label="カフェ"></button>
        <button class="beacon" style="left:25.8%;top:65.7%;" data-place="ブルーハーバー" aria-label="ブルーハーバー"></button>
        <button class="beacon" style="left:64.4%;top:78.8%;" data-place="シーサイド" aria-label="シーサイド"></button>
        <button class="beacon" style="left:38.8%;top:74.4%;" data-place="シーズンガーデン" aria-label="シーズンガーデン"></button>
      </div>
    </section>
  </main>

  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="songName">
    <div class="handle"></div>
    <p class="place-label">PLACE</p>
    <p class="place-name" id="placeName"></p>
    <p class="experience" id="experience"></p>
    <p class="place-copy" id="placeCopy"></p>
    <div class="divider"></div>
    <p class="song-label">MUSIC</p>
    <h2 class="song-name" id="songName"></h2>
    <div class="services">
      <a class="service" id="spotifyLink" target="_blank" rel="noopener">Spotify</a>
      <a class="service" id="appleLink" target="_blank" rel="noopener">Apple Music</a>
      <a class="service" id="youtubeLink" target="_blank" rel="noopener">YouTube</a>
    </div>
    <button class="next" id="nextButton">次の景色へ</button>
    <button class="close" id="closeButton">地図へ戻る</button>
  </section>

  <script>
    "use strict";

    const snowflakeLines = [
      [12,2,12,22], [2,12,22,12], [5,5,19,19], [19,5,5,19],
      [12,2,9.8,4.8], [12,2,14.2,4.8], [12,22,9.8,19.2], [12,22,14.2,19.2],
      [2,12,4.8,9.8], [2,12,4.8,14.2], [22,12,19.2,9.8], [22,12,19.2,14.2],
      [5,5,5.5,8.4], [5,5,8.4,5.5], [19,19,15.6,18.5], [19,19,18.5,15.6],
      [19,5,15.6,5.5], [19,5,18.5,8.4], [5,19,5.5,15.6], [5,19,8.4,18.5]
    ];
    function drawSnowflake(svg){
      const ns="http://www.w3.org/2000/svg";
      snowflakeLines.forEach(([x1,y1,x2,y2])=>{
        const line=document.createElementNS(ns,"line");
        line.setAttribute("x1",x1); line.setAttribute("y1",y1);
        line.setAttribute("x2",x2); line.setAttribute("y2",y2);
        svg.appendChild(line);
      });
    }
    document.querySelectorAll(".snowflake-svg").forEach(drawSnowflake);

    const places = {
      "展望台": {
        verb:"見つける",
        copy:"高く登れば、まだ知らない景色が見えてくる。",
        songs:["We'll go together","EVERYTHING IS EVERYTHING","星のうた","7%","SBY"],
        next:["歩道橋","シティライト","ブルーハーバー"]
      },
      "シティライト": {
        verb:"駆け抜ける",
        copy:"光あふれる街は、今日も前へ進み続ける。",
        songs:["Spark!!","BANG‼︎","I・だって止まらない","SAVE YOUR HEART","W"],
        next:["歩道橋","Snow Dome","展望台","ブルーハーバー"]
      },
      "Snow Dome": {
        verb:"熱くなる",
        copy:"光も歓声も、この街でいちばん熱い場所。",
        songs:["P.M.G.","Party! Party! Party!","Crazy F-R-E-S-H Beat","Make It Hot","守りたい、その笑顔"],
        next:["はじまりの広場","シティライト","歩道橋"]
      },
      "木漏れ日の道": {
        verb:"歩き出す",
        copy:"風に背中を押されて、また少し前へ。",
        songs:["From Today","A PIECE OF CAKE","Brand New Smile","TIKI TIKI","Days"],
        next:["歩道橋","はじまりの広場","ブルーハーバー","シーズンガーデン"]
      },
      "歩道橋": {
        verb:"踏み出す",
        copy:"一歩先へ。景色は歩いた人だけに見えてくる。",
        songs:["オトノナルホウヘ","Don't Hold Back","グッタイム","iro iro","ファンターナモーレ"],
        next:["展望台","シティライト","Snow Dome","木漏れ日の道","はじまりの広場"]
      },
      "はじまりの広場": {
        verb:"出会う",
        copy:"今日の景色は、ここから動き始める。",
        songs:["Snow World","Happy Birthday","NO SURRENDER！","ナミダの海を越えて行け","ブラザービート"],
        next:["Snow Dome","木漏れ日の道","カフェ","歩道橋"]
      },
      "カフェ": {
        verb:"整える",
        copy:"少しだけ立ち止まれば、次の景色がもっと楽しみになる。",
        songs:["ANY & EVERY","Luv Classic","Big Bang Sweet","What's your color?","Color me live..."],
        next:["はじまりの広場","木漏れ日の道","シーズンガーデン","シーサイド"]
      },
      "ブルーハーバー": {
        verb:"旅立つ",
        copy:"潮風に乗って、新しい景色へ漕ぎ出そう。",
        songs:["Lock on!","Wonderful! × Surprise!","Ready Go Round","ミッドナイト・トレンディ","8月の青"],
        next:["シーサイド","木漏れ日の道","展望台","シティライト"]
      },
      "シーサイド": {
        verb:"風を受ける",
        copy:"波と風が、心まで走らせてくれる。",
        songs:["Stories","REFRESH","YumYumYum 〜SpicyGirl〜","DA BOMB","Hip bounce!!"],
        next:["ブルーハーバー","シーズンガーデン","カフェ","シティライト"]
      },
      "シーズンガーデン": {
        verb:"巡る",
        copy:"季節が変わるたび、この街も少しずつ表情を変える。",
        songs:["HELLO HELLO","オレンジkiss","君は僕のもの","いっそ、嫌いになれたら。","My Sweet Girl"],
        next:["シーサイド","カフェ","木漏れ日の道","はじまりの広場"]
      }
    };

    const app=document.getElementById("app"), intro=document.getElementById("intro"), hint=document.getElementById("hint");
    const themeColor=document.getElementById("themeColor");
    const mapImage=document.getElementById("mapImage");
    const timeImages={
      morning:"snow-map-morning.png",
      day:"snow-map-day.png",
      evening:"snow-map-evening.png",
      night:"snow-map-night.png"
    };
    let currentTimeKey=null;
    const sheet=document.getElementById("sheet"), backdrop=document.getElementById("backdrop");
    const placeName=document.getElementById("placeName"), experience=document.getElementById("experience"), placeCopy=document.getElementById("placeCopy"), songName=document.getElementById("songName");
    const nextButton=document.getElementById("nextButton"), closeButton=document.getElementById("closeButton");
    const walkStatus=document.getElementById("walkStatus"), walkText=document.getElementById("walkText");
    const mapStage=document.querySelector(".map-stage");
    const spotifyLink=document.getElementById("spotifyLink"), appleLink=document.getElementById("appleLink"), youtubeLink=document.getElementById("youtubeLink");
    let currentPlace=null, previousSong=null, isTransitioning=false, isZoomed=false;

    function getTimeKey(){
      const h=new Date().getHours();
      if(h>=5&&h<11) return "morning";
      if(h>=11&&h<16) return "day";
      if(h>=16&&h<19) return "evening";
      return "night";
    }
    function setWorldTime(){
      const key=getTimeKey();
      app.classList.remove("time-morning","time-day","time-evening","time-night");
      document.body.classList.remove("time-morning","time-day","time-evening","time-night");
      app.classList.add(`time-${key}`);
      document.body.classList.add(`time-${key}`);
      const bgColors={morning:"#eef8fb",day:"#f8fbfb",evening:"#f6ece8",night:"#26394c"};
      themeColor?.setAttribute("content",bgColors[key]);
      if(key===currentTimeKey) return;
      currentTimeKey=key;
      const nextSrc=timeImages[key];
      const preload=new Image();
      preload.onload=()=>{
        mapImage.classList.add("switching");
        setTimeout(()=>{
          mapImage.src=nextSrc;
          requestAnimationFrame(()=>mapImage.classList.remove("switching"));
        },260);
      };
      preload.src=nextSrc;
    }
    function pick(list,excluded=null){ const c=list.filter(x=>x!==excluded); const p=c.length?c:list; return p[Math.floor(Math.random()*p.length)]; }
    function updateLinks(title){ const q=encodeURIComponent(`Snow Man ${title}`); spotifyLink.href=`https://open.spotify.com/search/${q}`; appleLink.href=`https://music.apple.com/jp/search?term=${q}`; youtubeLink.href=`https://www.youtube.com/results?search_query=${q}`; }
    function showSong(place){
      currentPlace=place;
      const data=places[place], song=pick(data.songs,previousSong);
      previousSong=song;
      placeName.textContent=place;
      experience.textContent=data.verb;
      placeCopy.textContent=data.copy;
      songName.textContent=song;
      updateLinks(song);
      document.body.style.overflow="hidden";
      hint.style.opacity="0";
      backdrop.classList.add("open");
      sheet.classList.remove("open");
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>sheet.classList.add("open"));
      });
    }
    function getBeacon(place){
      return [...document.querySelectorAll(".beacon")].find(b=>b.dataset.place===place);
    }
    function centerBeacon(beacon, behavior="smooth"){
      if(!beacon) return;
      const rect=beacon.getBoundingClientRect();
      const targetY=window.scrollY + rect.top + rect.height/2 - window.innerHeight*.43;
      window.scrollTo({top:Math.max(0,targetY),behavior});
    }
    function setWalkFocus(beacon){
      if(!beacon || !mapStage) return;
      const x=parseFloat(beacon.style.left || "50");
      const y=parseFloat(beacon.style.top || "50");
      mapStage.style.setProperty("--walk-x", `${x}%`);
      mapStage.style.setProperty("--walk-y", `${y}%`);
    }
    function closeSheet({keepZoom=true}={}){
      sheet.classList.remove("open");
      backdrop.classList.remove("open");
      document.body.style.overflow="";
      if(!keepZoom) returnToMap();
    }

    function returnToMap(){
      isZoomed=false;
      mapStage?.classList.remove("walking");
      mapStage?.style.setProperty("--walk-x", "50%");
      mapStage?.style.setProperty("--walk-y", "50%");
      window.scrollTo({top:0, behavior:"smooth"});
      hint.style.opacity=".5";
    }

    function arriveAt(place,{fromMap=false}={}){
      if(isTransitioning) return;
      const beacon=getBeacon(place);
      if(!beacon) return;
      isTransitioning=true;
      currentPlace=place;
      closeSheet({keepZoom:true});
      walkText.textContent=fromMap ? `${place}へ` : `${place}へ歩いています`;
      walkStatus.classList.add("show");
      setWalkFocus(beacon);
      isZoomed=true;
      requestAnimationFrame(()=>mapStage?.classList.add("walking"));
      setTimeout(()=>centerBeacon(beacon),90);
      setTimeout(()=>beacon.classList.add("arriving"),850);
      setTimeout(()=>{
        walkStatus.classList.remove("show");
        beacon.classList.remove("arriving");
        showSong(place);
        isTransitioning=false;
      },2850);
    }

    function continueWalk(){
      if(!currentPlace || isTransitioning) return;
      const destination=pick(places[currentPlace].next);
      arriveAt(destination,{fromMap:false});
    }

    document.querySelectorAll(".beacon").forEach(b=>{
      b.addEventListener("click",()=>arriveAt(b.dataset.place,{fromMap:!isZoomed}));
    });
    nextButton.addEventListener("click",continueWalk);
    closeButton.addEventListener("click",()=>closeSheet({keepZoom:false}));
    backdrop.addEventListener("click",()=>closeSheet({keepZoom:true}));
    document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet({keepZoom:true}); });
    setWorldTime(); setInterval(setWorldTime,60000);
    window.addEventListener("load",()=>setTimeout(()=>intro.classList.add("hide"),2000));
  </script>
</body>
</html>
